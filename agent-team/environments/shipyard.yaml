# 세션 컨테이너 템플릿. `shipyard env apply` 로 적용한다.
#
# networking을 `limited`로 두는 이유: 이 컨테이너 안에서 에이전트가 쓴 코드가 실행된다.
# 프롬프트 인젝션이든 실수든, 무제한 egress는 코드베이스가 어디로든 나갈 수 있다는 뜻이다.
# 패키지 매니저만 열어두고 나머지는 명시적으로 추가한다.
#
# 주의: 여기의 networking은 web_search / web_fetch를 통제하지 못한다. 그 둘은
# Anthropic 서버에서 돌기 때문이다. 그쪽을 조이려면 에이전트 툴 설정의
# allowed_domains / blocked_domains를 쓴다.
name: shipyard-app-dev
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true
    allow_mcp_servers: false
    allowed_hosts:
      # 앱 개발에 필요한 최소 집합. 프로젝트에 맞게 늘린다.
      - api.expo.dev
      - expo.dev
      - developer.apple.com
      - play.google.com
      - support.google.com
