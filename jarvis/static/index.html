<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>J.A.R.V.I.S. · COMMAND CENTER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233b9dff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233b9dff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/hud.css" />
</head>
<body>
<header class="bar">
  <div class="brand">J.A.R.V.I.S.<span>· COMMAND CENTER</span></div>
  <div class="bar-right">
    <span id="net" class="chip">NET —</span>
    <span id="clock" class="clock">--:--</span>
  </div>
</header>

<main class="hud">
  <!-- 왼쪽: 상태 -->
  <section class="panel" aria-labelledby="vitals-h">
    <h2 id="vitals-h">SYSTEM VITALS</h2>
    <div class="gauges">
      <div class="gauge"><div class="dial" id="g-cpu" style="--v:0"><b>—</b></div><span>CPU</span></div>
      <div class="gauge"><div class="dial" id="g-ram" style="--v:0"><b>—</b></div><span>RAM</span></div>
      <div class="gauge"><div class="dial" id="g-io" style="--v:0"><b>—</b></div><span>I/O</span></div>
    </div>

    <h2>VAULT SYNC</h2>
    <div class="meter"><i id="sync-bar" style="width:0%"></i></div>
    <p class="muted" id="sync-text">볼트를 읽는 중…</p>
    <ul class="kv" id="vault-kv"></ul>

    <h2>AUDIO I/O</h2>
    <canvas id="wave" height="56" aria-hidden="true"></canvas>
    <p class="muted" id="audio-state">LOCAL · STT 대기 · TTS 대기</p>
  </section>

  <!-- 가운데: 대화 -->
  <section class="panel center" aria-labelledby="core-h">
    <h2 id="core-h" class="sr-only">CORE</h2>
    <div class="core" id="core">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="core-label">J.A.R.V.I.S.</div>
    </div>
    <p class="status" id="status">스페이스바를 누른 채로 말하세요.</p>
    <p class="heard" id="heard"></p>
    <div class="answer" id="answer">브레인 · 기억 · 보이스 · HUD 준비 완료.</div>
    <form class="ask" id="ask-form" autocomplete="off">
      <input id="ask-input" placeholder="말하거나, 여기에 적으세요 — 예: 오늘 할 일 정리해줘" />
      <button type="submit">전송</button>
      <button type="button" id="mic" class="mic" title="누르고 말하기 (스페이스바)">🎙</button>
    </form>
    <p class="muted small" id="route-info"></p>
  </section>

  <!-- 오른쪽: 명령·일정 -->
  <section class="panel" aria-labelledby="deck-h">
    <h2 id="deck-h">COMMAND DECK</h2>
    <div class="deck" id="deck"></div>

    <h2>SCHEDULE · TODAY</h2>
    <ul class="schedule" id="schedule"></ul>
  </section>
</main>

<section class="panel wide" aria-labelledby="live-h">
  <h2 id="live-h">LIVE FROM THE VAULT</h2>
  <div class="notes" id="notes"></div>
</section>

<script src="/static/hud.js"></script>
</body>
</html>
